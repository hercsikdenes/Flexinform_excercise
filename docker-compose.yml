services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_service}
      POSTGRES_USER: ${POSTGRES_USER:-car_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-car_service_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-car_service}
      POSTGRES_USER: ${POSTGRES_USER:-car_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-car_service_dev_password}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_DSN: ${DATABASE_DSN:-postgres://${POSTGRES_USER:-car_service}:${POSTGRES_PASSWORD:-car_service_dev_password}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-car_service}?sslmode=disable}
      MIGRATIONS_DIR: /app/migrations
      DATA_DIR: /app/data
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    command: ["go", "test", "./..."]

volumes:
  postgres_data:
